server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**

        - id: workspace-service
          uri: lb://WORKSPACE-SERVICE
          predicates:
            - Path=/api/workspaces/**

        - id: zone-service
          uri: lb://ZONE-SERVICE
          predicates:
            - Path=/api/zones/**

        - id: analysis-service
          uri: lb://ANALYSIS-SERVICE
          predicates:
            - Path=/api/analyses/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/